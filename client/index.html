<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Postgres Docs Assistant</title>
<style>
  :root {
    --bg: #1a1d23;
    --panel: #22262e;
    --border: #333844;
    --text: #e8e6e1;
    --text-dim: #9199a6;
    --accent: #5fb3a3;
    --accent-dim: #3d7268;
    --source: #d4a24c;
    --error: #d4634c;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  header h1 {
    font-size: 15px;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.2px;
  }

  header .sub {
    color: var(--text-dim);
    font-size: 12px;
    margin-top: 2px;
  }

  .status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-dim);
  }

  .status .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--text-dim);
  }

  .status.connected .dot { background: var(--accent); }
  .status.error .dot { background: var(--error); }

  .new-chat {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 12px;
    padding: 6px 10px;
    border-radius: 6px;
    cursor: pointer;
  }
  .new-chat:hover { border-color: var(--accent-dim); color: var(--text); }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
  }

  .empty-state {
    color: var(--text-dim);
    font-size: 14px;
    text-align: center;
    margin-top: 80px;
    line-height: 1.6;
  }

  .msg {
    margin-bottom: 20px;
    display: flex;
  }

  .msg.user { justify-content: flex-end; }

  .bubble {
    max-width: 85%;
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 14px;
    line-height: 1.55;
    white-space: pre-wrap;
  }

  .msg.user .bubble {
    background: var(--accent-dim);
    color: var(--text);
    border-bottom-right-radius: 2px;
  }

  .msg.assistant .bubble {
    background: var(--panel);
    border: 1px solid var(--border);
    border-bottom-left-radius: 2px;
  }

  .msg.assistant .bubble.streaming::after {
    content: "▊";
    color: var(--accent);
    animation: blink 1s step-start infinite;
  }

  @keyframes blink { 50% { opacity: 0; } }

  .sources {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--text-dim);
  }

  .sources .label {
    color: var(--source);
    margin-bottom: 4px;
  }

  .source-item {
    padding: 2px 0;
  }

  .cached-tag {
    display: inline-block;
    margin-top: 8px;
    font-size: 11px;
    color: var(--source);
    border: 1px solid var(--source);
    border-radius: 4px;
    padding: 1px 6px;
  }

  .error-bubble {
    background: transparent;
    border: 1px solid var(--error);
    color: var(--error);
  }

  footer {
    border-top: 1px solid var(--border);
    padding: 16px 24px;
  }

  .input-row {
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    gap: 10px;
  }

  textarea {
    flex: 1;
    resize: none;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    line-height: 1.4;
    max-height: 120px;
  }

  textarea:focus {
    outline: none;
    border-color: var(--accent-dim);
  }

  button.send {
    background: var(--accent);
    color: #14231f;
    border: none;
    border-radius: 8px;
    padding: 0 18px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }

  button.send:disabled {
    background: var(--border);
    color: var(--text-dim);
    cursor: not-allowed;
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>Postgres Docs Assistant</h1>
    <div class="sub">RAG over the official PostgreSQL documentation</div>
  </div>
  <div style="display:flex; align-items:center; gap:12px;">
    <div class="status" id="status"><span class="dot"></span><span id="status-text">connecting…</span></div>
    <button class="new-chat" id="new-chat">New conversation</button>
  </div>
</header>

<main id="messages">
  <div class="empty-state" id="empty-state">
    Ask a question about PostgreSQL — indexes, transactions, performance,<br>
    whatever's in the knowledge base. Follow-up questions keep context.
  </div>
</main>

<footer>
  <div class="input-row">
    <textarea id="input" placeholder="Ask a question…" rows="1"></textarea>
    <button class="send" id="send">Send</button>
  </div>
</footer>

<script>
  // Change this if the gateway isn't running on localhost:8000
  const GATEWAY_WS_URL = "ws://localhost:8000/chat";

  const messagesEl = document.getElementById("messages");
  const emptyStateEl = document.getElementById("empty-state");
  const inputEl = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const statusEl = document.getElementById("status");
  const statusTextEl = document.getElementById("status-text");
  const newChatBtn = document.getElementById("new-chat");

  let ws = null;
  let conversationId = null;
  let currentAssistantBubble = null;

  function setStatus(state, text) {
    statusEl.className = "status " + state;
    statusTextEl.textContent = text;
  }

  function connect() {
    ws = new WebSocket(GATEWAY_WS_URL);

    ws.onopen = () => setStatus("connected", "connected");
    ws.onclose = () => setStatus("error", "disconnected — retrying…");
    ws.onerror = () => setStatus("error", "connection error");

    ws.onmessage = (event) => {
      const msg = JSON.parse(event.data);

      if (msg.type === "conversation") {
        conversationId = msg.conversation_id;
      } else if (msg.type === "token") {
        appendToken(msg.text);
      } else if (msg.type === "done") {
        finishAssistantMessage(msg.sources, msg.cached);
      } else if (msg.type === "error") {
        showError(msg.message);
      }
    };
  }

  function reconnectLoop() {
    connect();
    setInterval(() => {
      if (ws.readyState === WebSocket.CLOSED) connect();
    }, 2000);
  }

  function addUserMessage(text) {
    emptyStateEl.style.display = "none";
    const row = document.createElement("div");
    row.className = "msg user";
    row.innerHTML = `<div class="bubble">${escapeHtml(text)}</div>`;
    messagesEl.appendChild(row);
    scrollToBottom();
  }

  function startAssistantMessage() {
    const row = document.createElement("div");
    row.className = "msg assistant";
    row.innerHTML = `<div class="bubble streaming"></div>`;
    messagesEl.appendChild(row);
    currentAssistantBubble = row.querySelector(".bubble");
    scrollToBottom();
  }

  function appendToken(text) {
    if (!currentAssistantBubble) startAssistantMessage();
    currentAssistantBubble.textContent += text;
    scrollToBottom();
  }

  function finishAssistantMessage(sources, cached) {
    if (!currentAssistantBubble) return;
    currentAssistantBubble.classList.remove("streaming");

    if (sources && sources.length) {
      const sourcesEl = document.createElement("div");
      sourcesEl.className = "sources";
      const items = sources
        .slice(0, 5)
        .map(s => `<div class="source-item">— ${escapeHtml(s.document_title)} (score ${s.score.toFixed(3)})</div>`)
        .join("");
      sourcesEl.innerHTML = `<div class="label">Sources</div>${items}`;
      currentAssistantBubble.appendChild(sourcesEl);
    }

    if (cached) {
      const tag = document.createElement("div");
      tag.className = "cached-tag";
      tag.textContent = "cached";
      currentAssistantBubble.appendChild(tag);
    }

    currentAssistantBubble = null;
    sendBtn.disabled = false;
    scrollToBottom();
  }

  function showError(message) {
    emptyStateEl.style.display = "none";
    const row = document.createElement("div");
    row.className = "msg assistant";
    row.innerHTML = `<div class="bubble error-bubble">${escapeHtml(message)}</div>`;
    messagesEl.appendChild(row);
    currentAssistantBubble = null;
    sendBtn.disabled = false;
    scrollToBottom();
  }

  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function send() {
    const question = inputEl.value.trim();
    if (!question || ws.readyState !== WebSocket.OPEN) return;

    addUserMessage(question);
    startAssistantMessage();
    sendBtn.disabled = true;

    const payload = { question, top_k: 5 };
    if (conversationId) payload.conversation_id = conversationId;
    ws.send(JSON.stringify(payload));

    inputEl.value = "";
    inputEl.style.height = "auto";
  }

  sendBtn.addEventListener("click", send);
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });
  inputEl.addEventListener("input", () => {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + "px";
  });

  newChatBtn.addEventListener("click", () => {
    conversationId = null;
    messagesEl.innerHTML = "";
    messagesEl.appendChild(emptyStateEl);
    emptyStateEl.style.display = "block";
  });

  reconnectLoop();
</script>

</body>
</html>
